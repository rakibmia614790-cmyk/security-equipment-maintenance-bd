<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">SecureTech BD</title>
  <desc id="desc">Security Technology Engineering</desc>

  <defs>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="bdGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="flagClip">
      <rect x="1015" y="92" width="62" height="40" rx="5"/>
    </clipPath>
  </defs>

  <!-- security glow -->
  <circle cx="130" cy="150" r="115" fill="#22d3ee" opacity=".10" filter="url(#softGlow)"/>

  <!-- shield -->
  <path d="M130 22 L218 52 V125 C218 190 180 238 130 268 C80 238 42 190 42 125 V52 Z"
        fill="#071827" stroke="url(#cyanBlue)" stroke-width="7" filter="url(#glow)"/>

  <path d="M130 48 L191 68 V124 C191 169 166 203 130 227 C94 203 69 169 69 124 V68 Z"
        fill="none" stroke="#22d3ee" stroke-width="3" opacity=".75"/>

  <!-- security circuit -->
  <path d="M91 118 H116 V92 H145 V118 H170
           M91 151 H111 V178 H149 V151 H170
           M130 92 V72
           M130 178 V211"
        fill="none" stroke="url(#cyanBlue)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="91" cy="118" r="6" fill="#67e8f9"/>
  <circle cx="170" cy="118" r="6" fill="#67e8f9"/>
  <circle cx="91" cy="151" r="6" fill="#67e8f9"/>
  <circle cx="170" cy="151" r="6" fill="#67e8f9"/>
  <circle cx="130" cy="72" r="6" fill="#67e8f9"/>
  <circle cx="130" cy="211" r="6" fill="#67e8f9"/>

  <!-- animated scan -->
  <rect x="70" y="115" width="120" height="4" rx="2" fill="#a5f3fc" opacity=".9">
    <animate attributeName="y" values="75;205;75" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- main company name: ONE LINE -->
  <text x="275" y="137"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing="-1.5"
        fill="#f8fafc">
    <tspan>S</tspan><tspan>ecure</tspan><tspan fill="#67e8f9">T</tspan><tspan>ech</tspan>
  </text>

  <!-- BD filled with Bangladesh flag pattern -->
  <defs>
    <pattern id="bdFlag" patternUnits="userSpaceOnUse" width="110" height="72">
      <rect width="110" height="72" fill="#006a4e"/>
      <circle cx="55" cy="36" r="21" fill="#f42a41"/>
    </pattern>
  </defs>

  <text x="690" y="137"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="900"
        letter-spacing="-1"
        fill="url(#bdFlag)"
        stroke="#67e8f9"
        stroke-width="1.5"
        paint-order="stroke">
    BD
  </text>

  <!-- BD highlight glow -->
  <text x="690" y="137"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="900"
        letter-spacing="-1"
        fill="none"
        stroke="#67e8f9"
        stroke-width="1"
        opacity=".7">
    BD
  </text>

  <!-- tagline -->
  

  <!-- tagline -->
  <text x="278" y="195"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        letter-spacing="4"
        fill="#67e8f9">
    SECURITY • TECHNOLOGY • ENGINEERING
  </text>

  <!-- animated bottom line -->
  <line x1="278" y1="222" x2="1155" y2="222"
        stroke="url(#cyanBlue)" stroke-width="3" opacity=".55">
    <animate attributeName="x2" values="600;1155;600" dur="4s" repeatCount="indefinite"/>
  </line>

  <circle cx="278" cy="222" r="5" fill="#67e8f9">
    <animate attributeName="cx" values="278;1155;278" dur="4s" repeatCount="indefinite"/>
  </circle>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate { display: none; }
    }
  </style>
</svg>
